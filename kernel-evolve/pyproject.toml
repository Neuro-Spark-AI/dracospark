[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-evolve"
version = "0.1.0"
description = "Config, evaluators and profiling for LLM-driven Pallas TPU kernel evolution"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Neuro Spark"}]
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Neuro-Spark-AI/dracospark"
Issues = "https://github.com/Neuro-Spark-AI/dracospark/issues"

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
profile = ["xprof"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "numpy>=1.24", "jax>=0.4.30"]

[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
